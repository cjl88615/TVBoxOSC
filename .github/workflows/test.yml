name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project with submodules # 名字改了一下，更清晰
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive' # <-- 关键修正点：添加这一行来拉取子模块

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: "cmdline-tools;latest platform-tools build-tools;34.0.0 platforms;android-34"

      - name: Build with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --no-daemon --warning-mode all

      - name: Collect APKs
        run: |
          mkdir -p "${{ github.workspace }}/apk"
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} "${{ github.workspace }}/apk/" \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-apks
          path: ${{ github.workspace }}/apk
          if-no-files-found: error
